<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mundos Plotter</title>
    <link rel="stylesheet" href="../css/menu_lateral.css" />
    <link rel="stylesheet" href="../css/mundos.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>

    <div class="container_mundos">

        <aside class="menu_lateral">
            <div class="cabecalho_menu_lateral">
                <p>Plotter</p>
            </div>

            <nav class="navegacao_menu_lateral">
                <ul class="lista_menu_lateral">
                    <li>
                        <a href="dashboard.html" class="item_menu_lateral">
                            <img src="../Img/prazos/icon-dash-branco.svg" alt="">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="prazos.html" class="item_menu_lateral">
                            <img src="../Img/Dashboard/icon-prazos.svg" alt="">
                            <span>Prazos</span>
                        </a>
                    </li>
                    <li>
                        <a href="mundos.html" class="item_menu_lateral item_menu_ativo">
                            <img src="INSERIR LINK DA IMAGEM DO ÍCONE MUNDOS" alt="">
                            <span>Mundos</span>
                        </a>
                    </li>
                    <li>
                        <a href="personagens.html" class="item_menu_lateral">
                            <img src="INSERIR LINK DA IMAGEM DO ÍCONE PERSONAGENS" alt="">
                            <span>Personagens</span>
                        </a>
                    </li>
                    <li>
                        <a href="historias.html" class="item_menu_lateral">
                            <img src="INSERIR LINK DA IMAGEM DO ÍCONE HISTÓRIAS" alt="">
                            <span>Histórias</span>
                        </a>
                    </li>
                    <li>
                        <a href="plots.html" class="item_menu_lateral">
                            <img src="INSERIR LINK DA IMAGEM DO ÍCONE PLOTS" alt="">
                            <span>Plots</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="perfil_menu_lateral">
                <div class="avatar_usuario">
                    <span id="inicial_usuario_menu"></span>
                </div>
                <div class="info_perfil_menu">
                    <p id="nome_usuario_menu"></p>
                    <a href="configuracoes.html" class="link_configuracoes_menu">Configurações</a>
                </div>
            </div>
        </aside>

        <main class="conteudo_mundos">

            <header class="cabecalho_mundos">
                <div class="container_logo_mundos">
                    <img src="INSERIR LINK DA IMAGEM DO LOGO PLOTTER" alt="Logo_do_plotter" />
                </div>
            </header>

            <section class="titulo_mundos">
                <div class="texto_titulo_mundos">
                    <h1>Mundos</h1>
                    <p>Todos os mundos que você criou e em quais histórias cada um é usado.</p>
                </div>
                <a href="mundo-form.html" class="botao_criar_mundo">
                    <img src="INSERIR LINK DA IMAGEM DO ÍCONE MAIS" alt="">
                    <span>Criar novo mundo</span>
                </a>
            </section>

            <section class="grade_mundos" id="grade_mundos">
                <a href="mundo-form.html" class="card_novo_mundo" id="card_novo_mundo">
                    <div class="icone_card_novo_mundo">
                        <img src="INSERIR LINK DA IMAGEM DO ÍCONE MAIS" alt="">
                    </div>
                    <p>Criar novo mundo</p>
                </a>
            </section>

        </main>

    </div>

    <template id="template_card_mundo">
        <a href="mundo-ficha.html" class="card_mundo">
            <div class="capa_card_mundo">
                <img class="img_capa_card_mundo" alt="">
                <span class="iniciais_card_mundo" hidden></span>
            </div>
            <div class="info_card_mundo">
                <h2 class="nome_card_mundo"></h2>
                <p class="rotulo_historias_card_mundo">Aplicado em:</p>
                <ul class="lista_chips_card_mundo"></ul>
            </div>
        </a>
    </template>

    <template id="template_chip_historia_mundo">
        <li class="chip_historia_mundo">
            <span class="bolinha_historia"></span>
            <span class="nome_chip_historia"></span>
        </li>
    </template>

    <script src="../js/mundos.js"></script>
</body>
</html>
