<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasta de personagens Plotter</title>
    <link rel="stylesheet" href="../css/menu_lateral.css" />
    <link rel="stylesheet" href="../css/personagens.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>

    <div class="container_personagens">

        <aside class="menu_lateral">
            <div class="cabecalho_menu_lateral">
                <p>Plotter</p>
            </div>

            <nav class="navegacao_menu_lateral">
                <ul class="lista_menu_lateral">
                    <li>
                        <a href="dashboard.html" class="item_menu_lateral">
                            <img src="../Img/prazos/icon-dash-branco.svg" alt="">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="prazos.html" class="item_menu_lateral">
                            <img src="../Img/Dashboard/icon-prazos.svg" alt="">
                            <span>Prazos</span>
                        </a>
                    </li>
                    <li>
                        <a href="mundos.html" class="item_menu_lateral">
                            <img src="../Img/Dashboard/icon-mundos.svg" alt="">
                            <span>Mundos</span>
                        </a>
                    </li>
                    <li>
                        <a href="personagens.html" class="item_menu_lateral item_menu_ativo">
                            <img src="INSERIR LINK DA IMAGEM DO ÍCONE PERSONAGENS" alt="">
                            <span>Personagens</span>
                        </a>
                    </li>
                    <li>
                        <a href="historias.html" class="item_menu_lateral">
                            <img src="INSERIR LINK DA IMAGEM DO ÍCONE HISTÓRIAS" alt="">
                            <span>Histórias</span>
                        </a>
                    </li>
                    <li>
                        <a href="plots.html" class="item_menu_lateral">
                            <img src="INSERIR LINK DA IMAGEM DO ÍCONE PLOTS" alt="">
                            <span>Plots</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="perfil_menu_lateral">
                <div class="avatar_usuario">
                    <span id="inicial_usuario_menu"></span>
                </div>
                <div class="info_perfil_menu">
                    <p id="nome_usuario_menu"></p>
                    <a href="configuracoes.html" class="link_configuracoes_menu">Configurações</a>
                </div>
            </div>
        </aside>

        <main class="conteudo_personagens">

            <header class="cabecalho_personagens">
                <div class="container_logo_personagens">
                    <img src="INSERIR LINK DA IMAGEM DO LOGO PLOTTER" alt="Logo_do_plotter" />
                </div>
            </header>

            <section class="titulo_personagens">
                <div class="texto_titulo_personagens">
                    <a href="personagens.html" class="link_voltar_personagens">
                        <img src="INSERIR LINK DA IMAGEM DO ÍCONE SETA ESQUERDA" alt="">
                        <span>Voltar para personagens</span>
                    </a>
                    <h1 id="titulo_pasta_personagens"></h1>
                    <p id="contador_pasta_personagens"></p>
                </div>
                <div class="acoes_titulo_personagens">
                    <a href="personagem-formulario.html" class="botao_criar_personagem" id="botao_criar_personagem_pasta">
                        <img src="INSERIR LINK DA IMAGEM DO ÍCONE MAIS" alt="">
                        <span>Criar novo personagem</span>
                    </a>
                </div>
            </section>

            <section class="secao_sem_pasta_personagens">
                <div class="grade_personagens" id="grade_personagens">
                <a href="personagem-formulario.html" class="card_novo_personagem" id="card_novo_personagem_pasta">
                    <div class="icone_card_novo_personagem">
                        <img src="INSERIR LINK DA IMAGEM DO ÍCONE MAIS" alt="">
                    </div>
                    <p>Criar novo personagem</p>
                </a>
                </div>
            </section>

        </main>

    </div>

    <template id="template_card_personagem">
        <a href="personagem-ficha.html" class="card_personagem">
            <div class="capa_card_personagem">
                <img class="img_capa_card_personagem" alt="">
                <span class="iniciais_card_personagem" hidden></span>
            </div>
            <div class="info_card_personagem">
                <h2 class="nome_card_personagem"></h2>
                <p class="rotulo_historias_card_personagem">Aplicado em:</p>
                <ul class="lista_chips_card_personagem"></ul>
            </div>
        </a>
    </template>

    <template id="template_chip_historia_personagem">
        <li class="chip_historia_personagem">
            <span class="bolinha_historia"></span>
            <span class="nome_chip_historia"></span>
        </li>
    </template>

    <script src="../js/personagem-pasta.js"></script>
</body>
</html>
