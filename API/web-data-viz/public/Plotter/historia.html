<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>História Plotter</title>
    <link rel="stylesheet" href="../css/menu_lateral.css" />
    <link rel="stylesheet" href="../css/historia.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>

    <div class="container_historia">

        <aside class="menu_lateral">
            <div class="cabecalho_menu_lateral">
                <p>Plotter</p>
            </div>

            <nav class="navegacao_menu_lateral">
                <ul class="lista_menu_lateral">
                    <li>
                        <a href="dashboard.html" class="item_menu_lateral">
                            <img src="../Img/prazos/icon-dash-branco.svg" alt="">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="historias.html" class="item_menu_lateral item_menu_ativo">
                            <img src="../Img/Historia/icon-historias-roxo.svg" alt="">
                            <span>Histórias</span>
                        </a>
                    </li>
                    <li>
                        <a href="plot.html" class="item_menu_lateral">
                            <img src="../Img/Dashboard/icon-plots.svg" alt="">
                            <span>Plots</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="perfil_menu_lateral">
                <div class="avatar_usuario">
                    <span id="inicial_usuario_menu"></span>
                </div>
                <div class="info_perfil_menu">
                    <p id="nome_usuario_menu"></p>
                    <a href="configuracoes.html" class="link_configuracoes_menu">Configurações</a>
                </div>
            </div>
        </aside>

        <main class="conteudo_historia">

            <header class="cabecalho_historia">
                <div class="container_logo_historia">
                    <img src="../Img/Dashboard/icon-plotter-menor.svg" alt="Logo_do_plotter" />
                </div>
            </header>

            <a href="historias.html" class="link_voltar_historias">
                <img src="../Img/prazos/icon-seta-esquerda.svg" alt="">
                <span>Histórias</span>
            </a>

            <section class="card_cabecalho_historia">
                <!-- capa (preenchida pelo JS) -->
                <div id="area_capa_historia"></div>

                <div class="info_cabecalho_historia">
                    <h1 id="titulo_historia"></h1>
                    <!-- selo de classificação, gêneros e mundo (preenchidos pelo JS) -->
                    <div class="linha_tags_cabecalho_historia">
                        <span id="area_selo_historia"></span>
                        <ul class="lista_generos_cabecalho_historia" id="lista_generos_cabecalho_historia"></ul>
                        <div id="area_mundo_historia"></div>
                    </div>
                    <!-- personagens principais (preenchidos pelo JS) -->
                    <div id="area_personagens_historia"></div>
                </div>

                <!-- progresso + botão "Editar história" (preenchidos pelo JS) -->
                <div class="progresso_cabecalho_historia">
                    <p class="valor_progresso_historia" id="valor_progresso_historia"></p>
                    <div class="barra_progresso_historia" id="area_barra_progresso_historia"></div>
                    <p class="detalhe_progresso_historia" id="detalhe_progresso_historia"></p>
                    <a href="historias.html" class="botao_editar_historia" id="botao_editar_historia">Editar história</a>
                </div>
            </section>

            <section class="barra_filtros_capitulos">
                <!-- botões de filtro (preenchidos pelo JS) -->
                <div class="filtros_status_capitulos" id="filtros_status_capitulos"></div>
                <!-- botão "+ Capítulo" (preenchido pelo JS, só aparece em histórias sem plot) -->
                <div id="area_botao_novo_capitulo"></div>
            </section>

            <section class="grade_capitulos" id="grade_capitulos"></section>

            <div id="area_mensagem_sem_capitulos"></div>

            <div class="rodape_capitulos" id="rodape_capitulos"></div>

        </main>

    </div>

    <!-- proteção desativada por enquanto (volta para o login se não tiver usuário logado) -->
    <!-- <script src="../js/protecao.js"></script> -->
    <script src="../js/historia.js"></script>
</body>
</html>
